service:
  type: LoadBalancer
  spec:
    externalTrafficPolicy: Local
ports:
  web:
    port: 80
    exposedPort: 80
  websecure:
    port: 443
    exposedPort: 443
ingressClass:
  enabled: true
  isDefaultClass: true
ingressRoute:
  dashboard:
    enabled: false
log:
  level: INFO
accessLog:
  enabled: true
providers:
  kubernetesCRD:
    enabled: true
  kubernetesIngress:
    enabled: true
additionalArguments: __ADDITIONAL_ARGS__
persistence:
  enabled: true
  size: 1Gi
